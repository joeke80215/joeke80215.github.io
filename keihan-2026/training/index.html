<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#c85d3c" />
<title>京阪楓葉親子行｜13 週體力訓練追蹤</title>
<style>
:root{--bg:#fff8f0;--card:#fff;--ink:#47352d;--muted:#8b7468;--maple:#c85d3c;--maple2:#e58c5d;--gold:#e3b04b;--green:#668a63;--line:#eeded2;--soft:#f8e9de;--shadow:0 10px 30px rgba(111,72,51,.10);--r:22px}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff5ea 0,#fffaf5 45%,#fff 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;font-size:16px;line-height:1.55}button,input{font:inherit}.wrap{max-width:820px;margin:auto;padding:18px 16px 96px}.hero{background:linear-gradient(135deg,#bd5135,#e17a4d);color:#fff;border-radius:28px;padding:24px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"🍁";position:absolute;right:18px;top:8px;font-size:68px;opacity:.22;transform:rotate(15deg)}.eyebrow{font-size:13px;opacity:.9;font-weight:700;letter-spacing:.06em}.hero h1{font-size:28px;line-height:1.2;margin:6px 0}.countdown{font-size:18px;font-weight:800;margin-top:12px}.quote{margin-top:10px;background:rgba(255,255,255,.14);padding:12px 14px;border-radius:15px;font-size:15px}.back{display:inline-flex;margin-bottom:12px;text-decoration:none;color:var(--maple);font-weight:900}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.tab{border:0;border-radius:16px;padding:12px;background:#f2e5dc;color:var(--ink);font-weight:800;cursor:pointer}.tab.active{background:var(--ink);color:#fff}.section{display:none}.section.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:12px 0;box-shadow:0 5px 18px rgba(111,72,51,.06)}.label{font-size:13px;color:var(--muted);font-weight:800}.today-title{display:flex;align-items:center;justify-content:space-between;gap:10px}.today-title h2{font-size:23px;margin:2px 0}.badge{display:inline-flex;padding:6px 10px;border-radius:999px;background:var(--soft);color:var(--maple);font-size:13px;font-weight:800}.steps-box{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-top:12px}.steps-num{font-size:42px;font-weight:900;line-height:1;color:var(--maple)}.steps-num small{font-size:16px;color:var(--muted);font-weight:700}.checkline{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px dashed var(--line)}.checkline:last-child{border-bottom:0}.checkline input{width:21px;height:21px;accent-color:var(--maple)}.checkline.done span{text-decoration:line-through;color:#a88e80}.subhead{font-size:18px;font-weight:900;margin:0 0 6px}.hint{font-size:13px;color:var(--muted)}.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.status-item{display:flex;align-items:center;gap:8px;background:#fff9f5;border:1px solid var(--line);border-radius:14px;padding:10px}.status-item input{width:19px;height:19px;accent-color:var(--green)}.progress{height:12px;border-radius:999px;background:#f2e3da;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,var(--maple),var(--gold));width:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.stat{background:#fff7f1;border:1px solid var(--line);border-radius:15px;padding:12px;text-align:center}.stat strong{display:block;font-size:21px;color:var(--maple)}.week{margin-top:14px}.week-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{aspect-ratio:1;border-radius:12px;background:#f5e7de;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted);position:relative}.day b{font-size:13px;color:var(--ink)}.day.complete{background:#e6efe3;border-color:#cedfc9}.day.current{outline:2px solid var(--maple);outline-offset:1px}.day.future{opacity:.65}.day .dot{position:absolute;right:5px;top:4px;font-size:8px;color:var(--maple)}.reset{border:0;background:#f5e8df;color:#8b5b47;padding:9px 12px;border-radius:12px;font-weight:700;cursor:pointer}.empty{padding:28px;text-align:center;color:var(--muted)}.footer-note{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.calendar-head button{border:0;background:#f5e8df;color:var(--ink);width:38px;height:38px;border-radius:12px;font-weight:900;cursor:pointer}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal-weekday{text-align:center;font-size:12px;color:var(--muted);font-weight:800;padding:4px 0}.cal-day{min-height:82px;border:1px solid var(--line);background:#fffaf6;border-radius:14px;padding:8px;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:3px}.cal-day.out{opacity:.28;cursor:default}.cal-day.today{outline:2px solid var(--maple);outline-offset:1px}.cal-day.complete{background:#e9f2e7;border-color:#cfe0ca}.cal-day.selected{box-shadow:inset 0 0 0 2px var(--gold)}.cal-date{font-weight:900;font-size:13px}.cal-step{font-size:11px;color:var(--maple);font-weight:800}.cal-tag{font-size:9px;color:var(--muted)}.cal-check{position:absolute;right:7px;top:6px;color:var(--green);font-weight:900}.cal-detail h3{margin:2px 0 8px;font-size:20px}.mini-list{margin:8px 0 0;padding-left:20px}.mini-list li{margin:4px 0}.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px}.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:9px;height:9px;border-radius:50%;display:inline-block;background:#f2e3da}.legend .lg-today{background:var(--maple)}.legend .lg-complete{background:var(--green)}.legend .lg-strength{background:var(--gold)}
@media(max-width:520px){.wrap{padding:12px 12px 88px}.hero{padding:20px}.hero h1{font-size:24px}.steps-num{font-size:38px}.status-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr 1fr}.days{gap:4px}.day{border-radius:9px;font-size:9px}.day b{font-size:11px}.cal-day{min-height:70px;padding:6px}.cal-step{font-size:10px}.cal-tag{font-size:8px}}
</style>
</head>
<body><div class="wrap">
<a class="back" href="../">← 回京阪楓葉親子行</a>
<header class="hero"><div class="eyebrow">KEIHAN FAMILY TRIP TRAINING</div><h1>日本行前體力訓練 🍁</h1><div id="countdown" class="countdown"></div><div id="quote" class="quote"></div></header>
<nav class="tabs"><button class="tab active" data-tab="today">今天</button><button class="tab" data-tab="overview">總覽</button><button class="tab" data-tab="calendar">日曆</button></nav>
<main><section id="today" class="section active"></section><section id="overview" class="section"></section><section id="calendar" class="section"></section></main>
<div class="footer-note">資料只儲存在這台裝置的瀏覽器中。若出現膝蓋、足底或腳踝明顯疼痛，請停止加量。</div>
</div>
<script>
const tripDate=new Date('2026-12-11T00:00:00+08:00'),startDate=new Date('2026-09-14T00:00:00+08:00');
const plan=[[5000,5000,null,5500,5000,6000,null],[5500,5500,null,6000,5500,7000,5000],[6000,6000,null,6500,6000,8000,5500],[6500,6500,null,7000,6500,8000,6000],[7000,7000,null,7500,7000,9000,6500],[7500,7500,null,8000,7500,10000,7000],[8000,8000,null,8500,8000,10000,8000],[8000,8500,null,8500,8000,11000,8000],[8500,8500,null,9000,8500,11000,9000],[9000,9000,null,9500,9000,12000,8500],[9000,9500,null,10000,9000,12000,10000],[9000,9500,null,10000,9000,13000,11000],[8000,8000,null,7000,6000,7000,null]];
const sundayModes=['rest','easy','easy','easy','easy','easy','continuous','continuous','continuous','easy','continuous','continuous','rest'];
const strengthWeeks=Array.from({length:13},(_,i)=>i===12?[1]:[1,4]);
const strengthList=['深蹲 10～12 下 × 2 組','提踵 15～20 下 × 2 組','臀橋 12～15 下 × 2 組','台階上下：每腳 10 下 × 2 組','小腿伸展 20～30 秒','大腿前側伸展 20～30 秒'];
const statusList=['今天沒有膝蓋痛','今天沒有足底刺痛','今天沒有腳踝痛','小腿痠痛屬輕微、可正常活動','今天沒有磨腳或起水泡'];
const quotes=['今天多走一點點，12 月的日本就少累一點點。','不求一次走很遠，只求每週比上週更穩。','你正在替未來的自己存體力。','穩定，比爆衝更有用。','每一步，都是在替嵐山與 USJ 做準備。','走得舒服，比走得快重要。','今天完成，就是進步。','把體力練起來，旅行才能把注意力留給風景。','不用完美達標，持續出現就很厲害。','慢慢增加，身體會記住你的努力。','現在的日常步數，會變成旅行時的底氣。','休息不是偷懶，是訓練的一部分。','日本倒數中：讓雙腳先開始旅行。'];
const dayNames=['一','二','三','四','五','六','日'];
function key(w,d,t){return `osakaTrain_w${w}_d${d}_${t}`}function load(k){return localStorage.getItem(k)==='1'}function save(k,v){localStorage.setItem(k,v?'1':'0')}
function dateOnly(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}function diffDays(a,b){return Math.floor((dateOnly(a)-dateOnly(b))/86400000)}
function todayInfo(){const now=new Date(),idx=diffDays(now,startDate);if(idx<0)return{phase:'prep',daysToStart:-idx};if(idx>=91)return{phase:'done'};return{phase:'train',week:Math.floor(idx/7),day:idx%7}}
function dateFor(w,d){const x=new Date(startDate);x.setDate(x.getDate()+w*7+d);return x}function fmt(d){return `${d.getMonth()+1}/${d.getDate()}`}
function dayMode(w,d){if(d===2)return'rest';if(d===6)return sundayModes[w];return strengthWeeks[w].includes(d)?'strength':'walk'}
function modeLabel(m){return({rest:'休息日',easy:'輕鬆走',continuous:'連續步行訓練',strength:'走路＋肌力',walk:'走路日'})[m]||'走路日'}function modeEmoji(m){return({rest:'🌿',easy:'🚶',continuous:'👟',strength:'💪',walk:'🚶'})[m]||'🚶'}
function targetShort(t){return t==null?'休息':`${(t/1000).toFixed(t%1000?1:0)}k`}
function dayComplete(w,d){const target=plan[w][d],base=target==null?true:load(key(w,d,'steps')),s=strengthWeeks[w].includes(d),strengthOk=!s||strengthList.every((_,i)=>load(key(w,d,'s'+i))),statusOk=statusList.every((_,i)=>load(key(w,d,'st'+i)));return base&&strengthOk&&statusOk}
function renderHeader(){const now=new Date(),left=Math.ceil((tripDate-dateOnly(now))/86400000);document.getElementById('countdown').textContent=left>0?`距離 12/11 出發還有 ${left} 天 ✈️`:'旅行時間到了 ✈️';const di=Math.max(0,diffDays(now,startDate));document.getElementById('quote').textContent='「'+quotes[di%quotes.length]+'」'}
function bindChecks(root){root.querySelectorAll('input[data-key]').forEach(el=>{el.checked=load(el.dataset.key);const p=el.closest('.checkline');if(p&&el.checked)p.classList.add('done');el.addEventListener('change',()=>{save(el.dataset.key,el.checked);render()})})}
function renderToday(){const box=document.getElementById('today'),info=todayInfo();if(info.phase==='prep'){box.innerHTML=`<div class="card empty"><div style="font-size:42px">👟</div><h2>準備期</h2><p>正式 13 週計畫從 <b>9/14（一）</b>開始。這幾天先維持目前約 4,000～5,000 步，不用提前衝量。</p></div>`;return}if(info.phase==='done'){box.innerHTML=`<div class="card empty"><div style="font-size:42px">🎉</div><h2>13 週訓練完成</h2><p>接下來維持活動量、不要臨時暴增步數，準備出發！</p></div>`;return}const{week:w,day:d}=info,target=plan[w][d],isStrength=strengthWeeks[w].includes(d),mode=dayMode(w,d),dt=dateFor(w,d);let html=`<div class="card"><div class="today-title"><div><div class="label">第 ${w+1} 週・週${dayNames[d]}・${fmt(dt)}</div><h2>今天的任務</h2></div><span class="badge">${modeEmoji(mode)} ${modeLabel(mode)}</span></div>`;if(target==null){html+=`<div class="steps-box"><div><div class="label">今日安排</div><div class="steps-num" style="font-size:30px">休息 <small>維持日常活動即可</small></div></div></div><div class="hint" style="margin-top:14px">不需要為了達成訓練而額外補步數，讓雙腳與下肢完整恢復。</div></div>`}else{html+=`<div class="steps-box"><div><div class="label">建議步數</div><div class="steps-num">${target.toLocaleString()} <small>步</small></div></div></div><label class="checkline"><input type="checkbox" data-key="${key(w,d,'steps')}"><span>今天步數完成</span></label></div>`}if(isStrength)html+=`<div class="card"><div class="subhead">💪 今日肌力清單</div><div class="hint">前 2～3 週如果太累，先做 1 組也可以。</div>${strengthList.map((x,i)=>`<label class="checkline"><input type="checkbox" data-key="${key(w,d,'s'+i)}"><span>${x}</span></label>`).join('')}</div>`;html+=`<div class="card"><div class="subhead">🌿 今日狀況記錄</div><div class="hint">以「沒有出現不適」為完成。若有疼痛，今天不要硬加量。</div><div class="status-grid">${statusList.map((x,i)=>`<label class="status-item"><input type="checkbox" data-key="${key(w,d,'st'+i)}"><span>${x}</span></label>`).join('')}</div></div>`;box.innerHTML=html;bindChecks(box)}
function renderOverview(){const box=document.getElementById('overview');let completed=0,total=91;for(let w=0;w<13;w++)for(let d=0;d<7;d++)if(dayComplete(w,d))completed++;const pct=Math.round(completed/total*100),ti=todayInfo();let html=`<div class="card"><div class="subhead">13 週總進度</div><div class="progress"><div style="width:${pct}%"></div></div><div class="stats"><div class="stat"><strong>${pct}%</strong>完成度</div><div class="stat"><strong>${completed}</strong>完成天數</div><div class="stat"><strong>${total-completed}</strong>剩餘天數</div></div></div>`;for(let w=0;w<13;w++){const wc=Array.from({length:7},(_,d)=>dayComplete(w,d)).filter(Boolean).length;html+=`<div class="card week"><div class="week-head"><div><b>第 ${w+1} 週</b> <span class="hint">${fmt(dateFor(w,0))}～${fmt(dateFor(w,6))}</span></div><span class="badge">${wc}/7</span></div><div class="days">`;for(let d=0;d<7;d++){const complete=dayComplete(w,d),current=ti.phase==='train'&&ti.week===w&&ti.day===d,future=diffDays(dateFor(w,d),new Date())>0,str=strengthWeeks[w].includes(d),mode=dayMode(w,d),target=plan[w][d];html+=`<div class="day ${complete?'complete':''} ${current?'current':''} ${future?'future':''}" title="${modeLabel(mode)}">${str?'<span class="dot">●</span>':''}<b>週${dayNames[d]}</b><span>${targetShort(target)}</span>${d===6?`<span style="font-size:8px">${modeLabel(mode)}</span>`:''}${complete?'<span>✓</span>':''}</div>`}html+='</div></div>'}html+=`<div style="text-align:right;margin-top:10px"><button class="reset" id="resetBtn">清除所有追蹤紀錄</button></div>`;box.innerHTML=html;document.getElementById('resetBtn').onclick=()=>{if(confirm('確定要清除所有打勾紀錄嗎？')){Object.keys(localStorage).filter(k=>k.startsWith('osakaTrain_')).forEach(k=>localStorage.removeItem(k));render()}}}
let calendarCursor=new Date(startDate.getFullYear(),startDate.getMonth(),1),selectedCalendarDate=null;function planInfoForDate(dt){const idx=diffDays(dt,startDate);if(idx<0||idx>=91)return null;const w=Math.floor(idx/7),d=idx%7;return{week:w,day:d,target:plan[w][d],isStrength:strengthWeeks[w].includes(d),mode:dayMode(w,d)}}function sameDate(a,b){return a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function renderCalendarDetail(dt){const box=document.getElementById('calendarDetail');if(!box)return;const info=planInfoForDate(dt);if(!info){box.innerHTML=`<div class="card cal-detail"><div class="hint">這一天不在 13 週訓練期間內。</div></div>`;return}const{week:w,day:d,target,isStrength,mode}=info,completed=dayComplete(w,d),main=target==null?'休息・不設步數目標':`${target.toLocaleString()} 步`;box.innerHTML=`<div class="card cal-detail"><div class="label">第 ${w+1} 週・週${dayNames[d]}・${fmt(dt)}</div><h3>${main} ${completed?'✓':''}</h3><div class="badge">${modeEmoji(mode)} ${modeLabel(mode)}</div>${isStrength?`<div class="subhead" style="margin-top:14px">💪 肌力清單</div><ul class="mini-list">${strengthList.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}<div class="subhead" style="margin-top:14px">🌿 狀況記錄</div><ul class="mini-list">${statusList.map(x=>`<li>${x}</li>`).join('')}</ul><div class="hint" style="margin-top:10px">要實際打勾這一天的任務，請在當天使用「今天」頁面。</div></div>`}
function renderCalendar(){const box=document.getElementById('calendar'),year=calendarCursor.getFullYear(),month=calendarCursor.getMonth(),first=new Date(year,month,1),mondayIndex=(first.getDay()+6)%7,gridStart=new Date(year,month,1-mondayIndex);let html=`<div class="card"><div class="calendar-head"><button id="prevMonth">‹</button><div style="text-align:center"><div class="label">訓練日曆</div><div class="subhead">${year} 年 ${month+1} 月</div></div><button id="nextMonth">›</button></div><div class="calendar-grid">${['一','二','三','四','五','六','日'].map(x=>`<div class="cal-weekday">${x}</div>`).join('')}`;const now=new Date();for(let i=0;i<42;i++){const dt=new Date(gridStart);dt.setDate(gridStart.getDate()+i);const inMonth=dt.getMonth()===month,info=planInfoForDate(dt);let cls='cal-day';if(!inMonth)cls+=' out';if(info&&dayComplete(info.week,info.day))cls+=' complete';if(sameDate(dt,now))cls+=' today';if(selectedCalendarDate&&sameDate(dt,selectedCalendarDate))cls+=' selected';html+=`<div class="${cls}" ${inMonth?`data-date="${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}"`:''}><div class="cal-date">${dt.getDate()}</div>${info?`<div class="cal-step">${info.target==null?'休息':targetShort(info.target)+' 步'}</div><div class="cal-tag">${info.isStrength?'💪 肌力':modeEmoji(info.mode)+' '+modeLabel(info.mode)}</div>${dayComplete(info.week,info.day)?'<div class="cal-check">✓</div>':''}`:''}</div>`}html+=`</div><div class="legend"><span><i class="lg-today"></i>今天</span><span><i class="lg-complete"></i>已完成</span><span><i class="lg-strength"></i>肌力日</span><span>🌿 休息日</span><span>👟 連續步行</span></div></div><div id="calendarDetail"></div>`;box.innerHTML=html;document.getElementById('prevMonth').onclick=()=>{calendarCursor=new Date(year,month-1,1);renderCalendar()};document.getElementById('nextMonth').onclick=()=>{calendarCursor=new Date(year,month+1,1);renderCalendar()};box.querySelectorAll('.cal-day[data-date]').forEach(el=>el.onclick=()=>{const[y,m,d]=el.dataset.date.split('-').map(Number);selectedCalendarDate=new Date(y,m-1,d);renderCalendar();renderCalendarDetail(selectedCalendarDate)});if(selectedCalendarDate)renderCalendarDetail(selectedCalendarDate)}
function render(){renderHeader();renderToday();renderOverview();renderCalendar()}document.querySelectorAll('.tab').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.tab,.section').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.getElementById(btn.dataset.tab).classList.add('active')});render();
</script></body></html>
